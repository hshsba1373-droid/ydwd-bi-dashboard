<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伊甸各产品收款 BI 看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-0: #030308;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --rose: #fb7185;
    --gold: #fbbf24;
    --green: #34d399;
    --text-1: #f5f6fb;
    --text-2: #8b93ab;
    --text-3: #565f79;
    --glass: rgba(255,255,255,0.035);
    --glass-border: rgba(255,255,255,0.09);
  }
  html, body {
    background: var(--bg-0);
    color: var(--text-1);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    max-width: 100%;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(139,92,246,0.28), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 0%, rgba(34,211,238,0.18), transparent 55%),
      radial-gradient(ellipse 700px 500px at 50% 110%, rgba(251,113,133,0.12), transparent 55%);
  }

  /* ---------- Header ---------- */
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 16px; padding: 24px 32px 18px;
    position: sticky; top: 0; z-index: 30;
    background: rgba(3,3,8,0.88); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--glass-border);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-icon {
    width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 10px 30px -8px rgba(139,92,246,0.6);
  }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; color: #fff; }
  .brand .sub { color: var(--text-2); font-size: 12.5px; margin-top: 3px; letter-spacing: 0.2px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.28);
    color: #67e8f9; padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 500;
    backdrop-filter: blur(10px);
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #22d3ee;
    box-shadow: 0 0 10px 3px rgba(34,211,238,0.7); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ---------- Layout: Sidebar + Content ---------- */
  .layout { display: flex; align-items: flex-start; max-width: 1600px; margin: 0 auto; padding: 0 32px 60px; gap: 24px; }
  .sidebar {
    position: sticky; top: 108px; flex-shrink: 0; width: 208px;
    display: flex; flex-direction: column; gap: 6px;
    max-height: calc(100vh - 132px); overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--text-2); font-size: 13px; font-weight: 500;
    padding: 11px 16px; border-radius: 12px; cursor: pointer;
    transition: all 0.2s ease; backdrop-filter: blur(10px); width: 100%;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-1); transform: translateX(3px); }
  .nav-btn.active {
    background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(34,211,238,0.15));
    border-color: rgba(139,92,246,0.4); color: #fff;
    box-shadow: 0 4px 16px -4px rgba(139,92,246,0.5);
  }
  .nav-btn .emoji { font-size: 15px; flex-shrink: 0; }
  .nav-group-title {
    font-size: 10.5px; color: var(--text-3); font-weight: 600; letter-spacing: 0.6px;
    text-transform: uppercase; padding: 12px 10px 4px; margin-top: 4px;
  }
  .nav-group-title:first-child { margin-top: 0; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar {
      position: sticky; top: 84px; z-index: 20; width: 100%; max-height: none;
      flex-direction: row; overflow-x: auto; overflow-y: visible;
      background: rgba(3,3,8,0.85); backdrop-filter: blur(12px);
      padding: 10px 0; margin: 0 -32px; padding-left: 32px; padding-right: 32px;
    }
    .nav-btn { flex-shrink: 0; width: auto; white-space: nowrap; }
    .nav-group-title { display: none; }
  }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }

  /* ---------- KPI Overview (4-card row, inspired by reference dashboard) ---------- */
  .kpi-overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .kpi-overview { grid-template-columns: repeat(2, 1fr); } }
  .kpi-card {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px;
    padding: 18px 20px; backdrop-filter: blur(16px); position: relative; overflow: hidden;
  }
  .kpi-card .kpi-icon { font-size: 18px; margin-bottom: 8px; opacity: 0.9; }
  .kpi-card .kpi-label { color: var(--text-2); font-size: 12px; margin-bottom: 6px; }
  .kpi-card .kpi-num { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .kpi-card .kpi-foot { color: var(--text-3); font-size: 10.5px; margin-top: 4px; }
  .kpi-card.accent-a .kpi-num { color: #c4b5fd; }
  .kpi-card.accent-b .kpi-num { color: #67e8f9; }
  .kpi-card.accent-c .kpi-num { color: #6ee7b7; }
  .kpi-card.accent-d .kpi-num { color: #fbbf24; }

  /* ---------- Hero ---------- */
  .hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .hero { grid-template-columns: 1fr; } }
  .hero-main {
    background: linear-gradient(145deg, rgba(139,92,246,0.14), rgba(34,211,238,0.05));
    border: 1px solid var(--glass-border);
    border-radius: 26px; padding: 30px 34px; position: relative; overflow: hidden;
  }
  .hero-main::after {
    content: ''; position: absolute; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%);
    top: -100px; right: -80px; filter: blur(10px);
  }
  .hero-label { color: var(--text-2); font-size: 13px; letter-spacing: 0.5px; margin-bottom: 8px; }
  .hero-value {
    font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1;
    background: linear-gradient(90deg, #fff, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-target { color: var(--text-2); font-size: 13.5px; margin-top: 8px; }
  .hero-target b { color: var(--text-1); font-weight: 600; }
  .hero-bar-bg { height: 10px; border-radius: 8px; background: rgba(255,255,255,0.07); margin-top: 16px; overflow: hidden; }
  .hero-bar-fill { height: 100%; border-radius: 8px;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    box-shadow: 0 0 16px rgba(139,92,246,0.5); transition: width 0.8s ease; }
  .hero-pct { font-size: 13px; color: var(--cyan); margin-top: 8px; font-weight: 600; }

  .kpi-stack { display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; }
  .kpi-mini {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px;
    padding: 13px 18px; display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(16px);
  }
  .kpi-mini .l { color: var(--text-2); font-size: 11.5px; margin-bottom: 3px; }
  .kpi-mini .v { font-size: 18px; font-weight: 700; color: #fff; }
  .kpi-mini .v.c1 { color: #c4b5fd; }
  .kpi-mini .v.c2 { color: #67e8f9; }
  .kpi-mini .v.c3 { color: #6ee7b7; }
  .kpi-mini .icon {
    width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; background: rgba(255,255,255,0.06); flex-shrink: 0;
  }

  /* ---------- Sections (always rendered, stacked, scrollable) ---------- */
  .section { scroll-margin-top: 16px; }
  .card {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 22px;
    padding: 26px 28px; backdrop-filter: blur(16px);
    box-shadow: 0 24px 60px -30px rgba(0,0,0,0.6);
  }
  .card h2 {
    font-size: 15px; font-weight: 600; color: var(--text-1); margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between; letter-spacing: 0.2px;
  }
  .card h2 .tag { font-size: 10.5px; color: var(--text-3); font-weight: 500; letter-spacing: 0.3px; }

  /* ---------- Popover (hover / click drill-down) ---------- */
  .popover {
    position: fixed; z-index: 200; display: none;
    background: linear-gradient(160deg, rgba(22,22,34,0.98), rgba(13,13,21,0.98));
    border: 1px solid var(--glass-border); border-radius: 18px;
    padding: 20px 22px; max-width: 380px; width: 340px; max-height: 60vh; overflow-y: auto;
    box-shadow: 0 30px 80px -16px rgba(0,0,0,0.75);
  }
  .popover::-webkit-scrollbar { width: 4px; }
  .popover::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
  .popover.active { display: block; animation: popIn 0.16s ease; }
  @keyframes popIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .popover-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .popover-total { color: var(--text-2); font-size: 12px; margin-bottom: 14px; }
  .popover-total b { color: #fff; font-weight: 700; }

  /* split layout for panels that combine chart + list */
  .panel-split { display: grid; grid-template-columns: 300px 1fr; gap: 26px; align-items: start; }
  @media (max-width: 760px) { .panel-split { grid-template-columns: 1fr; } }

  /* ---------- 商务表现卡 (performance card grid) ---------- */
  .perf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .perf-card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 16px;
    padding: 16px 18px; position: relative; overflow: hidden; cursor: pointer; transition: background 0.15s ease;
  }
  .perf-card:hover { background: rgba(255,255,255,0.06); }
  .perf-card .perf-rank {
    position: absolute; top: 14px; right: 16px; font-size: 11px; font-weight: 700; color: var(--text-3);
  }
  .perf-card .perf-name { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .perf-card .perf-amount { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .perf-card .perf-target { font-size: 11px; color: var(--text-3); margin-bottom: 10px; }
  .perf-card .perf-ring-bg { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .perf-card .perf-ring-fill { height: 100%; border-radius: 6px; }
  .perf-card .perf-pct { font-size: 11px; margin-top: 6px; font-weight: 600; }

  .hbar-item { margin-bottom: 15px; transition: transform 0.15s ease; }
  .hbar-item:last-child { margin-bottom: 0; }
  .hbar-item.clickable { cursor: pointer; padding: 7px; border-radius: 12px; margin: -7px -7px 8px -7px; }
  .hbar-item.clickable:hover { background: rgba(255,255,255,0.045); }
  .hbar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .hbar-name { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #e5e7f0; font-weight: 500; min-width: 0; }
  .hbar-name span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-badge {
    width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; background: rgba(255,255,255,0.06); color: var(--text-2); flex-shrink: 0;
  }
  .rank-badge.r1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1c1300; }
  .rank-badge.r2 { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #1c1300; }
  .rank-badge.r3 { background: linear-gradient(135deg, #fb923c, #ea580c); color: #1c1300; }
  .hbar-value { font-size: 12.5px; font-weight: 700; color: #fff; white-space: nowrap; }
  .hbar-track { height: 7px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
  .hbar-sub { font-size: 10.5px; color: var(--text-3); margin-top: 4px; }

  .chart-canvas-holder { position: relative; height: 260px; }
  .chart-canvas-holder.tall { height: 320px; }

  .doughnut-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  table.mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.mini-table th {
    text-align: left; color: var(--text-3); font-weight: 500; padding: 7px 9px;
    border-bottom: 1px solid var(--glass-border); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  table.mini-table td { padding: 9px 9px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #d7dae4; }
  table.mini-table tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
  }
  .pill.warn { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .pill.danger { background: rgba(244,63,94,0.15); color: #fb7185; }
  .pill.ok { background: rgba(52,211,153,0.15); color: #6ee7b7; }

  .empty-hint { color: var(--text-3); font-size: 14px; padding: 40px 0; text-align: center; }

  .loading { color: var(--text-2); text-align: center; padding: 80px; font-size: 14px; }
  .error {
    color: #fca5a5; background: rgba(244,63,94,0.08); border: 1px solid rgba(244,63,94,0.3);
    padding: 12px 18px; border-radius: 14px; margin-bottom: -4px; font-size: 13px;
  }
  .footer-note { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 8px; letter-spacing: 0.3px; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🧧</div>
      <div>
        <h1>伊甸各产品收款 BI 看板</h1>
        <div class="sub">Google Sheets 实时数据同步 · 9月收款明细登记表</div>
      </div>
    </div>
    <div class="status-pill"><span class="dot"></span><span id="lastUpdated">同步中...</span></div>
  </div>

  <div class="layout">
    <nav class="sidebar" id="sideNav">
      <div class="nav-group-title">业绩总览</div>
      <button class="nav-btn active" data-target="sec-biz"><span class="emoji">🏆</span>商务业绩</button>
      <button class="nav-btn" data-target="sec-bizgoal"><span class="emoji">🎯</span>商务目标达成表</button>
      <button class="nav-btn" data-target="sec-perfcards"><span class="emoji">🃏</span>商务表现速览</button>
      <button class="nav-btn" data-target="sec-bizcatdetail"><span class="emoji">📊</span>商务分类完成明细</button>
      <div class="nav-group-title">目标与端口</div>
      <button class="nav-btn" data-target="sec-category"><span class="emoji">🗂️</span>分类型完成度</button>
      <button class="nav-btn" data-target="sec-porttable"><span class="emoji">📋</span>端口月度目标统计</button>
      <button class="nav-btn" data-target="sec-product"><span class="emoji">📦</span>产品业绩进度</button>
      <div class="nav-group-title">收款结构分析</div>
      <button class="nav-btn" data-target="sec-method"><span class="emoji">🤝</span>合作方式占比</button>
      <button class="nav-btn" data-target="sec-newrenew"><span class="emoji">🔁</span>新增/续费</button>

    <div class="content">
      <div id="errorBox"></div>

      <div class="kpi-overview" id="kpiOverview">
        <div class="kpi-card accent-a">
          <div class="kpi-icon">💰</div>
          <div class="kpi-label">总已收款</div>
          <div class="kpi-num" id="kpiTotalCurrent">0万</div>

        </div>
        <div class="kpi-card accent-b">
          <div class="kpi-icon">🎯</div>

        <div class="kpi-card accent-c">

      <div class="hero" id="heroSection">
        <div class="hero-main">
          <div class="hero-label">本月累计业绩</div>
          <div class="hero-value" id="heroValue">0万</div>
          <div class="hero-target">目标 <b id="heroTarget">0万</b></div>
          <div class="hero-bar-bg"><div class="hero-bar-fill" id="heroBarFill" style="width:0%"></div></div>
          <div class="hero-pct" id="heroPct">0.00% 已完成</div>
        </div>
        <div class="kpi-stack">
          <div class="kpi-mini">
            <div><div class="l">领先商务</div><div class="v c1" id="topBizName">-</div></div>
            <div class="icon">🏆</div>
          </div>
          <div class="kpi-mini">
            <div><div class="l">爆款产品</div><div class="v c2" id="topProductName">-</div></div>

  </div>

  <div class="popover" id="popover"></div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1jukli47VGtjei0dSxdTX-ql1UBbLKv3rhSns8e3fOLU/export?format=csv&gid=1198459175";
    const REFRESH_MS = 60 * 1000;
    let dailyChartInstance = null;
    let typeChartInstance = null;
    let bizChartInstance = null;
    let categoryBizBreakdown = {};
    let bizCategoryBreakdown = {};
    let productCategoryBreakdown = {};
    let methodCategoryBreakdown = {};
    let newRenewCategoryBreakdown = {};
    let groupDealsMap = {};

    const PALETTE = ['#8b5cf6','#22d3ee','#fb7185','#fbbf24','#34d399','#60a5fa','#f472b6','#a3e635','#f97316','#38bdf8'];

    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
          else field += c;
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\r') { /* skip */ }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else field += c;
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows;
    }
    function numOf(s) {
      if (!s) return 0;
      const n = parseFloat(String(s).replace(/,/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function pctOf(target, current) { if (!target) return 0; return Math.min(100, (current / target) * 100); }
    function fmt(n) {
      const wan = n / 10000;
      let s = wan.toFixed(2);
      if (s.endsWith('.00')) s = s.slice(0, -3);
      else if (s.endsWith('0')) s = s.slice(0, -1);
      if (s === '-0') s = '0';
      return s + '万';
    }
    function tickWan(v) {
      const wan = v / 10000;
      const rounded = Math.round(wan * 10) / 10;
      return rounded + '万';
    }

    function parseFlexDate(s) {
      if (!s) return null;
      const m = String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!m) return null;
      return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    }

    function rankBadge(idx) {
      const cls = idx === 0 ? 'r1' : idx === 1 ? 'r2' : idx === 2 ? 'r3' : '';
      const label = idx < 3 ? ['①','②','③'][idx] : (idx + 1);
      return `<span class="rank-badge ${cls}">${label}</span>`;
    }

    // ---- Side nav: scroll-to + scroll-spy ----
    function initSideNav() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.dataset.target);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }
    let scrollSpyTicking = false;
    function initScrollSpy() {
      window.removeEventListener('scroll', onScrollSpy);
      window.addEventListener('scroll', onScrollSpy, { passive: true });
      onScrollSpy();
    }
    function onScrollSpy() {
      if (scrollSpyTicking) return;
      scrollSpyTicking = true;
      requestAnimationFrame(() => {
        const sections = document.querySelectorAll('.section');
        const headerEl = document.querySelector('.header');
        const headerH = headerEl ? headerEl.getBoundingClientRect().height : 0;
        const triggerLine = headerH + 40;
        let activeId = null;
        sections.forEach(sec => {
          const rect = sec.getBoundingClientRect();
          if (rect.top <= triggerLine) activeId = sec.id;
        });
        if (!activeId && sections.length) activeId = sections[0].id;
        // If scrolled to (or near) the bottom of the page, force-activate the last section
        const scrollBottom = window.innerHeight + window.scrollY;
        if (scrollBottom >= document.documentElement.scrollHeight - 4 && sections.length) {
          activeId = sections[sections.length - 1].id;
        }
        if (activeId) {
          document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.target === activeId);
          });
        }
        scrollSpyTicking = false;
      });
    }

    // ---- Popover (hover + click) ----
    let popoverHideTimer = null;
    function showPopoverAt(el, innerHtml) {
      clearTimeout(popoverHideTimer);
      const pop = document.getElementById('popover');
      pop.innerHTML = innerHtml;
      pop.classList.add('active');
      // temporarily show off-screen to measure size
      pop.style.left = '-9999px';
      pop.style.top = '-9999px';
      const rect = el.getBoundingClientRect();
      const popRect = pop.getBoundingClientRect();
      const gap = 12;
      // Anchor near the progress-bar area (right half of the item), not over the name on the left
      let left = rect.left + rect.width * 0.55;
      let top = rect.top;
      if (left + popRect.width > window.innerWidth - gap) left = window.innerWidth - popRect.width - gap;
      if (left < gap) left = gap;
      if (top + popRect.height > window.innerHeight - gap) top = window.innerHeight - popRect.height - gap;
      if (top < gap) top = gap;
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
    }
    function hidePopoverSoon() {
      clearTimeout(popoverHideTimer);
      popoverHideTimer = setTimeout(() => {
        document.getElementById('popover').classList.remove('active');
      }, 160);
    }
    function bindPopoverTriggers(selector, buildHtmlFn) {
      document.querySelectorAll(selector).forEach(el => {
        const handler = () => showPopoverAt(el, buildHtmlFn(el));
        el.addEventListener('mouseenter', handler);
        el.addEventListener('mouseleave', hidePopoverSoon);
        el.addEventListener('click', (e) => { e.stopPropagation(); handler(); });
      });
    }

    function breakdownPopoverHtml(title, totalLabel, entries) {
      const total = entries.reduce((s, [,v]) => s + v, 0);
      let body = '';
      if (!entries.length) {
        body = '<div class="empty-hint" style="padding:20px 0;">暂无数据</div>';
      } else {
        body = entries.map(([name, amount], idx) => {
          const pct = total ? (amount / total * 100) : 0;
          const color = PALETTE[idx % PALETTE.length];
          return `
            <div class="hbar-item">
              <div class="hbar-top">
                <span class="hbar-name">${rankBadge(idx)} <span class="txt">${name}</span></span>
                <span class="hbar-value">${fmt(amount)} <span style="color:var(--text-3);font-weight:500;">(${pct.toFixed(1)}%)</span></span>
              </div>
              <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${color}"></div></div>
            </div>`;
        }).join('');
      }
      return `<div class="popover-title">${title}</div><div class="popover-total">${totalLabel} <b>${fmt(total)}</b></div>${body}`;
    }

    function groupDetailPopoverHtml(groupName) {
      const dealsForGroup = groupDealsMap[groupName] || [];
      const total = dealsForGroup.reduce((s, d) => s + d.amount, 0);
      let body = '';
      if (!dealsForGroup.length) {
        body = '<div class="empty-hint" style="padding:20px 0;">暂无合作明细</div>';
      } else {
        const sorted = [...dealsForGroup].sort((a,b) => b.amount - a.amount);
        body = `<table class="mini-table">
          <tr><th>产品</th><th>价格</th><th>分类</th><th>模式</th><th>到期</th></tr>
          ${sorted.map(d => `
            <tr>
              <td>${d.product.split('/')[0]}</td>
              <td>${fmt(d.amount)}</td>
              <td>${d.productType || '-'}</td>
              <td>${d.method || '-'}</td>
              <td>${d.expiry || '-'}</td>
            </tr>`).join('')}
        </table>`;
      }
      return `<div class="popover-title">${groupName} · 合作明细</div><div class="popover-total">合计收款 <b>${fmt(total)}</b> · 共 ${dealsForGroup.length} 笔</div>${body}`;
    }

    async function loadData() {
      try {
        const res = await fetch(CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        render(rows);
        document.getElementById('errorBox').innerHTML = '';
        document.getElementById('lastUpdated').textContent =
          '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      } catch (e) {
        document.getElementById('errorBox').innerHTML =
          '<div class="error">⚠️ 数据加载失败：' + e.message + '（60秒后自动重试）</div>';
      }
    }

    function render(rows) {
      const summaryRow = rows.find(r => r[0] === '数据汇总' && numOf(r[4]) > 0);
      const totalTarget = summaryRow ? numOf(summaryRow[4]) : 0;
      const totalCurrent = summaryRow ? numOf(summaryRow[5]) : 0;
      const totalPct = pctOf(totalTarget, totalCurrent);

      const typeNames = ['约炮','棋牌','直播','黄游','播放器','外围','AI服务','VPN'];
      const typeRows = rows.filter(r => typeNames.includes(r[0]))
        .map(r => ({ name: r[0], target: numOf(r[4]), current: numOf(r[5]) }));

      const bizNames = ['黄凯悦','周伟','吴倩','郭怀玉','全斗焕','程晨'];
      const bizRows = rows.filter(r => bizNames.includes(r[0]))
        .map(r => ({ name: r[0], target: numOf(r[4]), current: numOf(r[5]) }))
        .sort((a,b) => b.current - a.current);

      const summaryIdx = rows.findIndex(r => r[0] === '各产品收款汇总');
      const productRows = [];
      if (summaryIdx >= 0) {
        for (let i = summaryIdx + 2; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || r[0] === '数据汇总') break;
          productRows.push({ name: r[0], total: numOf(r[1]), target: numOf(r[2]) });
        }
      }
      productRows.sort((a,b) => b.total - a.total);

      // 商务 × 分类 新增/续费明细（对应"每人每分类完成情况"截图需求）
      const bizCategoryNewRenew = {};
      bizNames.forEach(bn => { bizCategoryNewRenew[bn] = {}; });

      const dailyStartIdx = rows.findIndex(r => /^\d{4}-\d{1,2}-\d{1,2}$/.test(r[0] || ''));
      const dailyRows = [];
      if (dailyStartIdx >= 0) {
        for (let i = dailyStartIdx; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(r[0])) break;
          dailyRows.push({ date: r[0], amount: numOf(r[1]) });
        }
      }

      const blockStart = 8;
      const blockWidth = 10;
      const numBlocks = 19;
      const productNames = [];
      const headerRow = rows[0] || [];
      for (let b = 0; b < numBlocks; b++) {
        productNames.push(headerRow[blockStart + b * blockWidth] || `产品${b+1}`);
      }
      const detailEndIdx = rows.findIndex(r => r[0] === '各产品收款汇总');
      const detailRowsEnd = detailEndIdx >= 0 ? detailEndIdx : rows.length;

      const deals = [];
      for (let r = 2; r < detailRowsEnd; r++) {
        const row = rows[r];
        if (!row) continue;
        for (let b = 0; b < numBlocks; b++) {
          const base = blockStart + b * blockWidth;
          const amount = numOf(row[base + 4]);
          if (!amount) continue;
          deals.push({
            payDate: row[base] || '',
            group: row[base + 1] || '',
            productType: row[base + 2] || '',
            method: (row[base + 3] || '').trim().toUpperCase(),
            amount,
            biz: row[base + 5] || '',
            expiry: row[base + 6] || '',
            newRenew: row[base + 7] || '',
            client: row[base + 8] || '',
            product: productNames[b],
          });
        }
      }

      const methodTotals = {};
      deals.forEach(d => { if (d.method) methodTotals[d.method] = (methodTotals[d.method] || 0) + d.amount; });
      const methodEntries = Object.entries(methodTotals).sort((a,b) => b[1] - a[1]);
      const methodGrandTotal = methodEntries.reduce((s, [,v]) => s + v, 0);

      deals.forEach(d => {
        const bizName = d.biz.trim() || '未标注';
        const cat = d.productType.trim() || '未标注';
        if (!bizCategoryNewRenew[bizName]) bizCategoryNewRenew[bizName] = {};
        if (!bizCategoryNewRenew[bizName][cat]) bizCategoryNewRenew[bizName][cat] = { newAmount: 0, renewAmount: 0 };
        const nr = d.newRenew.trim();
        if (nr === '新增') bizCategoryNewRenew[bizName][cat].newAmount += d.amount;
        else if (nr === '续费') bizCategoryNewRenew[bizName][cat].renewAmount += d.amount;
      });

      categoryBizBreakdown = {};
      typeNames.forEach(tn => { categoryBizBreakdown[tn] = {}; });
      deals.forEach(d => {
        const cat = d.productType.trim();
        const bizName = d.biz.trim() || '未标注';
        if (!categoryBizBreakdown[cat]) categoryBizBreakdown[cat] = {};
        categoryBizBreakdown[cat][bizName] = (categoryBizBreakdown[cat][bizName] || 0) + d.amount;
      });

      bizCategoryBreakdown = {};
      bizNames.forEach(bn => { bizCategoryBreakdown[bn] = {}; });
      deals.forEach(d => {
        const bizName = d.biz.trim() || '未标注';
        const cat = d.productType.trim() || '未标注';
        if (!bizCategoryBreakdown[bizName]) bizCategoryBreakdown[bizName] = {};
        bizCategoryBreakdown[bizName][cat] = (bizCategoryBreakdown[bizName][cat] || 0) + d.amount;
      });

      // 商务 新增/续费/合作数 明细（按合作群组去重，同一广告主只算一个）
      const bizDealStats = {};
      bizNames.forEach(bn => { bizDealStats[bn] = { newAmount: 0, renewAmount: 0, newPartners: new Set() }; });
      deals.forEach(d => {
        const bizName = d.biz.trim() || '未标注';
        if (!bizDealStats[bizName]) bizDealStats[bizName] = { newAmount: 0, renewAmount: 0, newPartners: new Set() };
        const nr = d.newRenew.trim();
        const partnerKey = d.group.trim() || d.client.trim() || '未命名';
        if (nr === '新增') {
          bizDealStats[bizName].newAmount += d.amount;
          bizDealStats[bizName].newPartners.add(partnerKey);
        }
        else if (nr === '续费') { bizDealStats[bizName].renewAmount += d.amount; }
      });

      productCategoryBreakdown = {};
      deals.forEach(d => {
        const prod = d.product;
        const cat = d.productType.trim() || '未标注';
        if (!productCategoryBreakdown[prod]) productCategoryBreakdown[prod] = {};
        productCategoryBreakdown[prod][cat] = (productCategoryBreakdown[prod][cat] || 0) + d.amount;
      });

      methodCategoryBreakdown = {};
      deals.forEach(d => {
        if (!d.method) return;
        const cat = d.productType.trim() || '未标注';
        if (!methodCategoryBreakdown[d.method]) methodCategoryBreakdown[d.method] = {};
        methodCategoryBreakdown[d.method][cat] = (methodCategoryBreakdown[d.method][cat] || 0) + d.amount;
      });

      newRenewCategoryBreakdown = {};
      deals.forEach(d => {
        const key = d.newRenew.trim() || '未标注';
        const cat = d.productType.trim() || '未标注';
        if (!newRenewCategoryBreakdown[key]) newRenewCategoryBreakdown[key] = {};
        newRenewCategoryBreakdown[key][cat] = (newRenewCategoryBreakdown[key][cat] || 0) + d.amount;
      });

      groupDealsMap = {};
      deals.forEach(d => {
        const key = d.group.trim() || d.client.trim() || '未命名';
        if (!groupDealsMap[key]) groupDealsMap[key] = [];
        groupDealsMap[key].push(d);
      });

      const newRenewTotals = {};
      deals.forEach(d => {
        const key = d.newRenew.trim() || '未标注';
        newRenewTotals[key] = (newRenewTotals[key] || 0) + d.amount;
      });
      const newRenewEntries = Object.entries(newRenewTotals).sort((a,b) => b[1] - a[1]);
      const newRenewGrandTotal = newRenewEntries.reduce((s, [,v]) => s + v, 0);

      const groupTotals = {};
      deals.forEach(d => {
        const key = d.group.trim() || d.client.trim() || '未命名';
        groupTotals[key] = (groupTotals[key] || 0) + d.amount;
      });
      const groupEntries = Object.entries(groupTotals).sort((a,b) => b[1] - a[1]).slice(0, 10);

      const today = new Date(); today.setHours(0,0,0,0);
      const in7days = new Date(today); in7days.setDate(in7days.getDate() + 7);
      const expiringDeals = deals
        .map(d => ({ ...d, expiryDate: parseFlexDate(d.expiry) }))
        .filter(d => d.expiryDate && d.expiryDate >= today && d.expiryDate <= in7days)
        .sort((a,b) => a.expiryDate - b.expiryDate);

      const dealCount = deals.length;
      const avgDeal = dealCount ? (deals.reduce((s,d) => s + d.amount, 0) / dealCount) : 0;
      const newDealCount = (() => {
        const seen = new Set();
        deals.forEach(d => {
          if (d.newRenew.trim() === '新增') seen.add(d.group.trim() || d.client.trim() || '未命名');
        });
        return seen.size;
      })();

      document.getElementById('heroValue').textContent = fmt(totalCurrent);
      document.getElementById('heroTarget').textContent = fmt(totalTarget);
      document.getElementById('heroBarFill').style.width = totalPct + '%';
      document.getElementById('heroPct').textContent = totalPct.toFixed(2) + '% 已完成';

      document.getElementById('kpiTotalCurrent').textContent = fmt(totalCurrent);
      document.getElementById('kpiTotalTarget').textContent = fmt(totalTarget);
      document.getElementById('kpiAchieveRate').textContent = totalPct.toFixed(1) + '%';
      document.getElementById('kpiNewDealCount').textContent = newDealCount;

      const topBiz = bizRows[0];
      const topProduct = productRows[0];
      document.getElementById('topBizName').textContent = topBiz ? `${topBiz.name} · ${fmt(topBiz.current)}` : '暂无数据';
      document.getElementById('topProductName').textContent = topProduct ? `${topProduct.name.split('/')[0]} · ${fmt(topProduct.total)}` : '暂无数据';
      document.getElementById('dealStats').textContent = dealCount ? `${dealCount}单 / ${fmt(avgDeal)}` : '暂无数据';

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '';

      // ===== Section: 商务业绩排名 =====
      let bizListHtml = '';
      bizRows.forEach((b, idx) => {
        const pct = pctOf(b.target, b.current);
        const widthPct = pct;
        const color = PALETTE[idx % PALETTE.length];
        bizListHtml += `
          <div class="hbar-item clickable" data-biz="${b.name}">
            <div class="hbar-top">
              <span class="hbar-name">${rankBadge(idx)} <span class="txt">${b.name}</span></span>
              <span class="hbar-value">${fmt(b.current)}</span>
            </div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            <div class="hbar-sub">目标 ${fmt(b.target)} · 完成 ${pct.toFixed(1)}% · 悬停查看分类占比</div>
          </div>`;
      });
      container.innerHTML += `
        <div class="section" id="sec-biz"><div class="card">
          <h2>商务业绩排名 <span class="tag">TEAM PERFORMANCE</span></h2>
          <div class="panel-split">
            <div>
              <div class="chart-canvas-holder"><canvas id="bizChart"></canvas></div>
              <div class="doughnut-legend" id="bizLegend"></div>
            </div>
            <div>${bizListHtml}</div>
          </div>
        </div></div>`;

      // ===== Section: 商务目标达成表 =====
      let bizTableHtml = `<div class="section" id="sec-bizgoal"><div class="card"><h2>商务目标达成表 <span class="tag">TARGET ACHIEVEMENT</span></h2>`;
      if (bizRows.length) {
        bizTableHtml += `<table class="mini-table"><tr>
          <th>商务</th><th>基础目标</th><th>已收款</th><th>新增金额</th><th>续费金额</th><th>新增笔数</th><th>完成进度</th>
        </tr>`;
        bizRows.forEach(b => {
          const pct = pctOf(b.target, b.current);
          const stats = bizDealStats[b.name] || { newAmount: 0, renewAmount: 0, newCount: 0 };
          const pillClass = pct >= 100 ? 'ok' : pct >= 50 ? 'warn' : 'danger';
          bizTableHtml += `<tr>
            <td>${b.name}</td>
            <td>${fmt(b.target)}</td>
            <td>${fmt(b.current)}</td>
            <td>${fmt(stats.newAmount)}</td>
            <td>${fmt(stats.renewAmount)}</td>
            <td>${stats.newPartners ? stats.newPartners.size : 0}</td>
            <td><span class="pill ${pillClass}">${pct.toFixed(1)}%</span></td>
          </tr>`;
        });
        bizTableHtml += `</table>`;
      } else {
        bizTableHtml += `<div class="empty-hint">暂无商务目标数据</div>`;
      }
      bizTableHtml += '</div></div>';
      container.innerHTML += bizTableHtml;

      // ===== Section: 商务表现速览 (perf cards) =====
      let perfHtml = `<div class="section" id="sec-perfcards"><div class="card"><h2>商务表现速览 <span class="tag">PERFORMANCE CARDS</span></h2><div class="perf-grid">`;
      bizRows.forEach((b, idx) => {
        const pct = pctOf(b.target, b.current);
        const color = pct >= 100 ? '#34d399' : pct >= 50 ? '#fbbf24' : '#fb7185';
        perfHtml += `
          <div class="perf-card" data-biz="${b.name}">
            <div class="perf-rank">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#'+(idx+1)}</div>
            <div class="perf-name">${b.name}</div>
            <div class="perf-amount" style="color:${color}">${fmt(b.current)}</div>
            <div class="perf-target">目标 ${fmt(b.target)}</div>
            <div class="perf-ring-bg"><div class="perf-ring-fill" style="width:${Math.min(100,pct)}%;background:${color}"></div></div>
            <div class="perf-pct" style="color:${color}">${pct.toFixed(1)}% 已完成</div>
          </div>`;
      });
      perfHtml += `</div></div></div>`;
      container.innerHTML += perfHtml;

      // ===== Section: 商务分类完成明细（每人每分类 新增/续费，转盘+进度条风格） =====
      let bizCatDetailHtml = `<div class="section" id="sec-bizcatdetail"><div class="card"><h2>商务分类完成明细 <span class="tag">BY BIZ &amp; CATEGORY</span></h2>`;
      const bizCatChartConfigs = [];
      if (bizRows.length) {
        bizRows.forEach((b, bIdx) => {
          const catMap = bizCategoryNewRenew[b.name] || {};
          const catEntries = Object.entries(catMap)
            .map(([cat, v]) => [cat, v.newAmount + v.renewAmount, v])
            .filter(([, sum]) => sum > 0)
            .sort((a, b2) => b2[1] - a[1]);
          const chartId = `bizCatChart-${bIdx}`;
          const legendId = `bizCatLegend-${bIdx}`;
          bizCatDetailHtml += `
            <div style="margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,0.06);">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                <span style="font-size:14px;font-weight:700;color:#fff;">${b.name}</span>
                <span style="font-size:11px;color:var(--text-3);">目标 ${fmt(b.target)} · 已完成 ${fmt(b.current)}</span>
              </div>`;
          if (catEntries.length) {
            const maxCatSum = Math.max(...catEntries.map(([,sum]) => sum), 1);
            let barsHtml = '';
            catEntries.forEach(([cat, sum, v], idx) => {
              const widthPct = (sum / maxCatSum) * 100;
              const color = PALETTE[idx % PALETTE.length];
              barsHtml += `
                <div class="hbar-item">
                  <div class="hbar-top">
                    <span class="hbar-name"><span class="legend-dot" style="background:${color}"></span><span class="txt">${cat}</span></span>
                    <span class="hbar-value">${fmt(sum)}</span>
                  </div>
                  <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
                  <div class="hbar-sub">新增 ${v.newAmount ? fmt(v.newAmount) : '0万'} · 续费 ${v.renewAmount ? fmt(v.renewAmount) : '0万'}</div>
                </div>`;
            });
            bizCatDetailHtml += `
              <div class="panel-split">
                <div>
                  <div class="chart-canvas-holder" style="height:200px;"><canvas id="${chartId}"></canvas></div>
                  <div class="doughnut-legend" id="${legendId}"></div>
                </div>
                <div>${barsHtml}</div>
              </div>`;
            bizCatChartConfigs.push({ chartId, legendId, labels: catEntries.map(e => e[0]), data: catEntries.map(e => e[1]) });
          } else {
            bizCatDetailHtml += `<div class="empty-hint" style="padding:14px 0;">暂无分类数据</div>`;
          }
          bizCatDetailHtml += `</div>`;
        });
      } else {
        bizCatDetailHtml += `<div class="empty-hint">暂无商务数据</div>`;
      }
      bizCatDetailHtml += `</div></div>`;
      container.innerHTML += bizCatDetailHtml;


      // ===== Section: 分类型目标完成度 =====
      let typeProgressHtml = '';
      typeRows.forEach((t, idx) => {
        const pct = pctOf(t.target, t.current);
        const widthPct = t.target ? pct : 0;
        const color = PALETTE[idx % PALETTE.length];
        typeProgressHtml += `
          <div class="hbar-item clickable" data-category="${t.name}">
            <div class="hbar-top">
              <span class="hbar-name"><span class="legend-dot" style="background:${color}"></span><span class="txt">${t.name}</span></span>
              <span class="hbar-value">${fmt(t.current)}</span>
            </div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            <div class="hbar-sub">目标 ${fmt(t.target)} · 完成 ${t.target ? pct.toFixed(1)+'%' : '-'} · 悬停查看各商务贡献</div>
          </div>`;
      });
      container.innerHTML += `
        <div class="section" id="sec-category"><div class="card">
          <h2>分类型目标完成度 <span class="tag">BY CATEGORY</span></h2>
          <div class="panel-split">
            <div>
              <div class="chart-canvas-holder"><canvas id="typeChart"></canvas></div>
              <div class="doughnut-legend" id="typeLegend"></div>
            </div>
            <div>${typeProgressHtml}</div>
          </div>
        </div></div>`;

      // ===== Section: 销售端口月度目标统计（转盘+进度条风格）=====
      let portProgressHtml = '';
      const sortedTypeRows = [...typeRows].sort((a,b) => pctOf(b.target,b.current) - pctOf(a.target,a.current));
      sortedTypeRows.forEach((t, idx) => {
        const pct = pctOf(t.target, t.current);
        const widthPct = t.target ? pct : 0;
        const color = PALETTE[idx % PALETTE.length];
        portProgressHtml += `
          <div class="hbar-item">
            <div class="hbar-top">
              <span class="hbar-name"><span class="legend-dot" style="background:${color}"></span><span class="txt">${t.name}</span></span>
              <span class="hbar-value">${fmt(t.current)}</span>
            </div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            <div class="hbar-sub">月度目标 ${fmt(t.target)} · 完成率 ${t.target ? pct.toFixed(1)+'%' : '-'}</div>
          </div>`;
      });
      container.innerHTML += `
        <div class="section" id="sec-porttable"><div class="card">
          <h2>销售端口月度目标统计 <span class="tag">MONTHLY PORT TARGET</span></h2>
          <div class="panel-split">
            <div>
              <div class="chart-canvas-holder"><canvas id="portChart"></canvas></div>
              <div class="doughnut-legend" id="portLegend"></div>
            </div>
            <div>${portProgressHtml}</div>
          </div>
        </div></div>`;

      // ===== Section: 伊甸维度产品业绩进度 =====
      let prodHtml = `<div class="section" id="sec-product"><div class="card"><h2>伊甸维度产品业绩进度 <span class="tag">% OF MONTHLY PRODUCT TARGET</span></h2>`;
      productRows.forEach((p, idx) => {
        const pct = pctOf(p.target, p.total);
        const widthPct = p.target ? pct : 0;
        const color = PALETTE[idx % PALETTE.length];
        prodHtml += `
          <div class="hbar-item clickable" data-product="${p.name}">
            <div class="hbar-top">
              <span class="hbar-name">${rankBadge(idx)} <span class="txt">${p.name}</span></span>
              <span class="hbar-value">${fmt(p.total)}</span>
            </div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            <div class="hbar-sub">本产品月目标 ${p.target ? fmt(p.target) : '未设定'} · 占本产品月目标进度 ${p.target ? pct.toFixed(1)+'%' : '-'} · 悬停查看分类占比</div>
          </div>`;
      });
      prodHtml += '</div></div>';
      container.innerHTML += prodHtml;

      // ===== Section: 合作方式占比 =====
      let methodHtml = `<div class="section" id="sec-method"><div class="card"><h2>合作方式占比 <span class="tag">BY DEAL TYPE</span></h2>`;
      if (methodEntries.length) {
        methodEntries.forEach(([method, amount], idx) => {
          const pct = methodGrandTotal ? (amount / methodGrandTotal) * 100 : 0;
          const color = PALETTE[idx % PALETTE.length];
          methodHtml += `
            <div class="hbar-item clickable" data-method="${method}">
              <div class="hbar-top">
                <span class="hbar-name">${rankBadge(idx)} <span class="txt">${method}</span></span>
                <span class="hbar-value">${fmt(amount)}</span>
              </div>
              <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${color}"></div></div>
              <div class="hbar-sub">占总收款 ${pct.toFixed(1)}% · 悬停查看分类占比</div>
            </div>`;
        });
      } else {
        methodHtml += `<div class="empty-hint">暂无合作方式数据</div>`;
      }
      methodHtml += '</div></div>';
      container.innerHTML += methodHtml;

      // ===== Section: 新增 / 续费构成 =====
      let newRenewHtml = `<div class="section" id="sec-newrenew"><div class="card"><h2>新增 / 续费构成 <span class="tag">NEW VS RENEWAL</span></h2>`;
      if (newRenewEntries.length) {
        const nrColors = { '新增': '#34d399', '续费': '#60a5fa' };
        newRenewEntries.forEach(([label, amount], idx) => {
          const pct = newRenewGrandTotal ? (amount / newRenewGrandTotal) * 100 : 0;
          const color = nrColors[label] || PALETTE[idx % PALETTE.length];
          newRenewHtml += `
            <div class="hbar-item clickable" data-newrenew="${label}">
              <div class="hbar-top">
                <span class="hbar-name">${rankBadge(idx)} <span class="txt">${label}</span></span>
                <span class="hbar-value">${fmt(amount)}</span>
              </div>
              <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${color}"></div></div>
              <div class="hbar-sub">占总收款 ${pct.toFixed(1)}% · 悬停查看分类占比</div>
            </div>`;
        });
      } else {
        newRenewHtml += `<div class="empty-hint">暂无新增/续费数据</div>`;
      }
      newRenewHtml += '</div></div>';
      container.innerHTML += newRenewHtml;

      // ===== Section: 合作群组/客户 Top榜 =====
      let groupHtml = `<div class="section" id="sec-partners"><div class="card"><h2>合作群组 / 客户 Top榜 <span class="tag">TOP PARTNERS</span></h2>`;
      if (groupEntries.length) {
        const maxGroup = Math.max(...groupEntries.map(([,v]) => v), 1);
        groupEntries.forEach(([name, amount], idx) => {
          const widthPct = (amount / maxGroup) * 100;
          const color = PALETTE[idx % PALETTE.length];
          groupHtml += `
            <div class="hbar-item clickable" data-group="${name}">
              <div class="hbar-top">
                <span class="hbar-name">${rankBadge(idx)} <span class="txt">${name}</span></span>
                <span class="hbar-value">${fmt(amount)}</span>
              </div>
              <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
              <div class="hbar-sub">悬停查看合作明细</div>
            </div>`;
        });
      } else {
        groupHtml += `<div class="empty-hint">暂无合作群组数据</div>`;
      }
      groupHtml += '</div></div>';
      container.innerHTML += groupHtml;

      // ===== Section: 即将到期提醒 =====
      let expiryHtml = `<div class="section" id="sec-expiry"><div class="card"><h2>即将到期提醒 <span class="tag">EXPIRING IN 7 DAYS</span></h2>`;
      if (expiringDeals.length) {
        expiryHtml += `<table class="mini-table"><tr><th>产品</th><th>客户/群组</th><th>金额</th><th>到期</th><th>状态</th></tr>`;
        expiringDeals.forEach(d => {
          const daysLeft = Math.round((d.expiryDate - today) / 86400000);
          const pillClass = daysLeft <= 2 ? 'danger' : daysLeft <= 4 ? 'warn' : 'ok';
          const pillText = daysLeft === 0 ? '今天到期' : `${daysLeft}天后`;
          expiryHtml += `<tr>
            <td>${d.product.split('/')[0]}</td>
            <td>${(d.client || d.group).slice(0, 18)}</td>
            <td>${fmt(d.amount)}</td>
            <td>${d.expiry}</td>
            <td><span class="pill ${pillClass}">${pillText}</span></td>
          </tr>`;
        });
        expiryHtml += `</table>`;
      } else {
        expiryHtml += `<div class="empty-hint">未来7天内暂无到期合作 ✅</div>`;
      }
      expiryHtml += '</div></div>';
      container.innerHTML += expiryHtml;

      // ===== Section: 每日流水趋势 =====
      container.innerHTML += `
        <div class="section" id="sec-daily"><div class="card">
          <h2>每日流水趋势 <span class="tag">SEPTEMBER DAILY</span></h2>
          <div class="chart-canvas-holder tall"><canvas id="dailyChart"></canvas></div>
        </div></div>`;

      renderTypeChart(typeRows);
      renderBizChart(bizRows);
      renderPortChart(typeRows);
      bizCatChartConfigs.forEach(cfg => renderBizCatChart(cfg));
      renderDailyChart(dailyRows);
      initScrollSpy();

      // --- bind popover triggers (hover + click) ---
      bindPopoverTriggers('.hbar-item.clickable[data-category]', (el) => {
        const cat = el.dataset.category;
        const entries = Object.entries(categoryBizBreakdown[cat] || {}).sort((a,b) => b[1]-a[1]);
        return breakdownPopoverHtml(`${cat} · 各商务完成情况`, '该分类总收款', entries);
      });
      bindPopoverTriggers('.hbar-item.clickable[data-biz]', (el) => {
        const bizName = el.dataset.biz;
        const entries = Object.entries(bizCategoryBreakdown[bizName] || {}).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
        return breakdownPopoverHtml(`${bizName} · 各分类业绩占比`, `${bizName} 本月总业绩`, entries);
      });
      bindPopoverTriggers('.perf-card[data-biz]', (el) => {
        const bizName = el.dataset.biz;
        const entries = Object.entries(bizCategoryBreakdown[bizName] || {}).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
        return breakdownPopoverHtml(`${bizName} · 各分类业绩占比`, `${bizName} 本月总业绩`, entries);
      });
      bindPopoverTriggers('.hbar-item.clickable[data-product]', (el) => {
        const name = el.dataset.product;
        const entries = Object.entries(productCategoryBreakdown[name] || {}).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
        return breakdownPopoverHtml(`产品「${name.split('/')[0]}」· 分类占比`, '总收款', entries);
      });
      bindPopoverTriggers('.hbar-item.clickable[data-method]', (el) => {
        const name = el.dataset.method;
        const entries = Object.entries(methodCategoryBreakdown[name] || {}).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
        return breakdownPopoverHtml(`合作方式「${name}」· 分类占比`, '总收款', entries);
      });
      bindPopoverTriggers('.hbar-item.clickable[data-newrenew]', (el) => {
        const name = el.dataset.newrenew;
        const entries = Object.entries(newRenewCategoryBreakdown[name] || {}).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
        return breakdownPopoverHtml(`${name} · 分类占比`, '总收款', entries);
      });
      bindPopoverTriggers('.hbar-item.clickable[data-group]', (el) => {
        return groupDetailPopoverHtml(el.dataset.group);
      });
    }

    function renderTypeChart(typeRows) {
      const ctx = document.getElementById('typeChart');
      if (!ctx) return;
      const labels = typeRows.map(t => t.name);
      const data = typeRows.map(t => t.current);
      const hasData = data.some(v => v > 0);
      const displayData = hasData ? data : typeRows.map(t => t.target || 1);
      const colors = labels.map((_, i) => PALETTE[i % PALETTE.length]);

      if (typeChartInstance) typeChartInstance.destroy();
      typeChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: displayData, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => c.label + ': ' + fmt(c.parsed) }
            }
          }
        }
      });
      const legend = document.getElementById('typeLegend');
      legend.innerHTML = labels.map((l, i) =>
        `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l}</div>`
      ).join('');
    }

    function renderBizChart(bizRows) {
      const ctx = document.getElementById('bizChart');
      if (!ctx) return;
      const labels = bizRows.map(b => b.name);
      const data = bizRows.map(b => b.current);
      const hasData = data.some(v => v > 0);
      const displayData = hasData ? data : bizRows.map(b => b.target || 1);
      const colors = labels.map((_, i) => PALETTE[i % PALETTE.length]);

      if (bizChartInstance) bizChartInstance.destroy();
      bizChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: displayData, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => c.label + ': ' + fmt(c.parsed) }
            }
          }
        }
      });
      const legend = document.getElementById('bizLegend');
      legend.innerHTML = labels.map((l, i) =>
        `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l}</div>`
      ).join('');
    }

    let portChartInstance = null;
    function renderPortChart(typeRows) {
      const ctx = document.getElementById('portChart');
      if (!ctx) return;
      const labels = typeRows.map(t => t.name);
      const data = typeRows.map(t => t.current);
      const hasData = data.some(v => v > 0);
      const displayData = hasData ? data : typeRows.map(t => t.target || 1);
      const colors = labels.map((_, i) => PALETTE[i % PALETTE.length]);
      if (portChartInstance) portChartInstance.destroy();
      portChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: displayData, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => c.label + ': ' + fmt(c.parsed) }
            }
          }
        }
      });
      const legend = document.getElementById('portLegend');
      if (legend) legend.innerHTML = labels.map((l, i) =>
        `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l}</div>`
      ).join('');
    }

    const bizCatChartInstances = {};
    function renderBizCatChart({ chartId, legendId, labels, data }) {
      const ctx = document.getElementById(chartId);
      if (!ctx) return;
      const colors = labels.map((_, i) => PALETTE[i % PALETTE.length]);
      if (bizCatChartInstances[chartId]) bizCatChartInstances[chartId].destroy();
      bizCatChartInstances[chartId] = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => c.label + ': ' + fmt(c.parsed) }
            }
          }
        }
      });
      const legend = document.getElementById(legendId);
      if (legend) legend.innerHTML = labels.map((l, i) =>
        `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l}</div>`
      ).join('');
    }

    function renderDailyChart(dailyRows) {
      const ctx = document.getElementById('dailyChart');
      if (!ctx || !dailyRows.length) return;
      const c2d = ctx.getContext('2d');
      const gradient = c2d.createLinearGradient(0, 0, 0, 320);
      gradient.addColorStop(0, 'rgba(139,92,246,0.45)');
      gradient.addColorStop(1, 'rgba(34,211,238,0.02)');

      const labels = dailyRows.map(d => d.date.split('-').slice(1).join('/'));
      const data = dailyRows.map(d => d.amount);

      if (dailyChartInstance) dailyChartInstance.destroy();
      dailyChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data, fill: true, backgroundColor: gradient, borderColor: '#8b5cf6',
            borderWidth: 2.5, tension: 0.35, pointRadius: 0, pointHoverRadius: 5,
            pointHoverBackgroundColor: '#22d3ee', pointHoverBorderColor: '#fff',
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => fmt(c.parsed.y) }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#8b93ab', font: { size: 10 }, maxRotation: 0 } },
            y: {
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#8b93ab', font: { size: 10 }, callback: (v) => tickWan(v) }
            }
          }
        }
      });
    }

    // popover: stay open while hovered, close when clicking elsewhere on page
    document.getElementById('popover').addEventListener('mouseenter', () => clearTimeout(popoverHideTimer));
    document.getElementById('popover').addEventListener('mouseleave', hidePopoverSoon);
    document.addEventListener('click', (e) => {
      const pop = document.getElementById('popover');
      if (!pop.contains(e.target) && !e.target.closest('.hbar-item.clickable')) {
        pop.classList.remove('active');
      }
    });

    initSideNav();
    loadData();
    setInterval(loadData, REFRESH_MS);
  </script>
</body>
</html>
