<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伊甸各产品收款 BI 看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-0: #030308;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --rose: #fb7185;
    --gold: #fbbf24;
    --green: #34d399;
    --text-1: #f5f6fb;
    --text-2: #8b93ab;
    --text-3: #565f79;
    --glass: rgba(255,255,255,0.035);
    --glass-border: rgba(255,255,255,0.09);
  }
  html, body {
    background: var(--bg-0);
    color: var(--text-1);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(139,92,246,0.28), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 0%, rgba(34,211,238,0.18), transparent 55%),
      radial-gradient(ellipse 700px 500px at 50% 110%, rgba(251,113,133,0.12), transparent 55%);
  }
  .container { max-width: 1520px; margin: 0 auto; padding: 40px 32px 80px; }

  /* ---------- Header ---------- */
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 16px; margin-bottom: 36px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-icon {
    width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 10px 30px -8px rgba(139,92,246,0.6);
  }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; color: #fff; }
  .brand .sub { color: var(--text-2); font-size: 12.5px; margin-top: 3px; letter-spacing: 0.2px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.28);
    color: #67e8f9; padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 500;
    backdrop-filter: blur(10px);
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #22d3ee;
    box-shadow: 0 0 10px 3px rgba(34,211,238,0.7); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ---------- Hero ---------- */
  .hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-bottom: 22px; }
  @media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
  .hero-main {
    background: linear-gradient(145deg, rgba(139,92,246,0.14), rgba(34,211,238,0.05));
    border: 1px solid var(--glass-border);
    border-radius: 26px; padding: 34px 36px; position: relative; overflow: hidden;
  }
  .hero-main::after {
    content: ''; position: absolute; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%);
    top: -100px; right: -80px; filter: blur(10px);
  }
  .hero-label { color: var(--text-2); font-size: 13px; letter-spacing: 0.5px; margin-bottom: 10px; }
  .hero-value {
    font-size: 52px; font-weight: 800; letter-spacing: -1px; line-height: 1;
    background: linear-gradient(90deg, #fff, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-target { color: var(--text-2); font-size: 13.5px; margin-top: 10px; }
  .hero-target b { color: var(--text-1); font-weight: 600; }
  .hero-bar-bg { height: 10px; border-radius: 8px; background: rgba(255,255,255,0.07); margin-top: 18px; overflow: hidden; }
  .hero-bar-fill { height: 100%; border-radius: 8px;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    box-shadow: 0 0 16px rgba(139,92,246,0.5); transition: width 0.8s ease; }
  .hero-pct { font-size: 13px; color: var(--cyan); margin-top: 8px; font-weight: 600; }

  .kpi-stack { display: grid; grid-template-rows: repeat(3, 1fr); gap: 12px; }
  .kpi-mini {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(16px);
  }
  .kpi-mini .l { color: var(--text-2); font-size: 12px; margin-bottom: 4px; }
  .kpi-mini .v { font-size: 19px; font-weight: 700; color: #fff; }
  .kpi-mini .v.c1 { color: #c4b5fd; }
  .kpi-mini .v.c2 { color: #67e8f9; }
  .kpi-mini .v.c3 { color: #6ee7b7; }
  .kpi-mini .icon {
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: rgba(255,255,255,0.06); flex-shrink: 0;
  }

  /* ---------- Grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 22px;
    padding: 24px 26px; backdrop-filter: blur(16px);
    box-shadow: 0 24px 60px -30px rgba(0,0,0,0.6);
  }
  .card.span2 { grid-column: 1 / -1; }
  .card h2 {
    font-size: 14px; font-weight: 600; color: var(--text-1); margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between; letter-spacing: 0.2px;
  }
  .card h2 .tag { font-size: 10px; color: var(--text-3); font-weight: 500; letter-spacing: 0.3px; }

  .hbar-item { margin-bottom: 15px; }
  .hbar-item:last-child { margin-bottom: 0; }
  .hbar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .hbar-name { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #e5e7f0; font-weight: 500; min-width: 0; }
  .hbar-name span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-badge {
    width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; background: rgba(255,255,255,0.06); color: var(--text-2); flex-shrink: 0;
  }
  .rank-badge.r1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1c1300; }
  .rank-badge.r2 { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #1c1300; }
  .rank-badge.r3 { background: linear-gradient(135deg, #fb923c, #ea580c); color: #1c1300; }
  .hbar-value { font-size: 12.5px; font-weight: 700; color: #fff; white-space: nowrap; }
  .hbar-track { height: 7px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
  .hbar-sub { font-size: 10.5px; color: var(--text-3); margin-top: 4px; }

  .chart-canvas-holder { position: relative; height: 220px; }
  .chart-canvas-holder.tall { height: 270px; }
  .chart-canvas-holder.short { height: 170px; }

  .doughnut-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .split-row { display: flex; align-items: center; gap: 20px; }
  .split-row .chart-col { flex-shrink: 0; }
  .split-row .stat-col { flex: 1; }
  .split-stat {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px;
  }
  .split-stat:last-child { border-bottom: none; }

  table.mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.mini-table th {
    text-align: left; color: var(--text-3); font-weight: 500; padding: 6px 8px;
    border-bottom: 1px solid var(--glass-border); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  table.mini-table td { padding: 8px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #d7dae4; }
  table.mini-table tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
  }
  .pill.warn { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .pill.danger { background: rgba(244,63,94,0.15); color: #fb7185; }
  .pill.ok { background: rgba(52,211,153,0.15); color: #6ee7b7; }

  .empty-hint { color: var(--text-3); font-size: 13px; padding: 30px 0; text-align: center; }

  .loading { color: var(--text-2); text-align: center; padding: 80px; font-size: 14px; grid-column: 1/-1; }
  .error {
    color: #fca5a5; background: rgba(244,63,94,0.08); border: 1px solid rgba(244,63,94,0.3);
    padding: 12px 18px; border-radius: 14px; margin-bottom: 18px; font-size: 13px;
  }
  .footer-note { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 40px; letter-spacing: 0.3px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">🧧</div>
        <div>
          <h1>伊甸各产品收款 BI 看板</h1>
          <div class="sub">Google Sheets 实时数据同步 · 9月收款明细登记表</div>
        </div>
      </div>
      <div class="status-pill"><span class="dot"></span><span id="lastUpdated">同步中...</span></div>
    </div>

    <div id="errorBox"></div>

    <div class="hero" id="heroSection">
      <div class="hero-main">
        <div class="hero-label">本月累计业绩</div>
        <div class="hero-value" id="heroValue">¥0</div>
        <div class="hero-target">目标 <b id="heroTarget">¥0</b></div>
        <div class="hero-bar-bg"><div class="hero-bar-fill" id="heroBarFill" style="width:0%"></div></div>
        <div class="hero-pct" id="heroPct">0.00% 已完成</div>
      </div>
      <div class="kpi-stack">
        <div class="kpi-mini">
          <div><div class="l">领先商务</div><div class="v c1" id="topBizName">-</div></div>
          <div class="icon">🏆</div>
        </div>
        <div class="kpi-mini">
          <div><div class="l">爆款产品</div><div class="v c2" id="topProductName">-</div></div>
          <div class="icon">🚀</div>
        </div>
        <div class="kpi-mini">
          <div><div class="l">总单数 / 客单均价</div><div class="v c3" id="dealStats">-</div></div>
          <div class="icon">📊</div>
        </div>
      </div>
    </div>

    <div class="grid" id="mainGrid">
      <div class="loading">数据加载中，请稍候...</div>
    </div>

    <div class="footer-note">幸运儿自动看板 · 每 60 秒刷新一次</div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1jukli47VGtjei0dSxdTX-ql1UBbLKv3rhSns8e3fOLU/export?format=csv&gid=1198459175";
    const REFRESH_MS = 60 * 1000;
    let dailyChartInstance = null;
    let typeChartInstance = null;
    let methodChartInstance = null;
    let newRenewChartInstance = null;

    const PALETTE = ['#8b5cf6','#22d3ee','#fb7185','#fbbf24','#34d399','#60a5fa','#f472b6','#a3e635','#f97316','#38bdf8'];

    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
          else field += c;
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\r') { /* skip */ }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else field += c;
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows;
    }
    function numOf(s) {
      if (!s) return 0;
      const n = parseFloat(String(s).replace(/,/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function pctOf(target, current) { if (!target) return 0; return Math.min(100, (current / target) * 100); }
    function fmt(n) { return '¥' + Math.round(n).toLocaleString(); }

    function parseFlexDate(s) {
      if (!s) return null;
      const m = String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!m) return null;
      return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    }

    async function loadData() {
      try {
        const res = await fetch(CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        render(rows);
        document.getElementById('errorBox').innerHTML = '';
        document.getElementById('lastUpdated').textContent =
          '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      } catch (e) {
        document.getElementById('errorBox').innerHTML =
          '<div class="error">⚠️ 数据加载失败：' + e.message + '（60秒后自动重试）</div>';
      }
    }

    function rankBadge(idx) {
      const cls = idx === 0 ? 'r1' : idx === 1 ? 'r2' : idx === 2 ? 'r3' : '';
      const label = idx < 3 ? ['①','②','③'][idx] : (idx + 1);
      return `<span class="rank-badge ${cls}">${label}</span>`;
    }

    function render(rows) {
      const summaryRow = rows.find(r => r[0] === '数据汇总' && numOf(r[4]) > 0);
      const totalTarget = summaryRow ? numOf(summaryRow[4]) : 0;
      const totalCurrent = summaryRow ? numOf(summaryRow[5]) : 0;
      const totalPct = pctOf(totalTarget, totalCurrent);

      const typeNames = ['约炮','博彩','直播','黄游','播放器','外围','AI服务','VPN'];
      const typeRows = rows.filter(r => typeNames.includes(r[0]))
        .map(r => ({ name: r[0], target: numOf(r[4]), current: numOf(r[5]) }));

      const bizNames = ['黄凯悦','周伟','吴倩','郭怀玉','全斗焕','程晨'];
      const bizRows = rows.filter(r => bizNames.includes(r[0]))
        .map(r => ({ name: r[0], target: numOf(r[4]), current: numOf(r[5]) }))
        .sort((a,b) => b.current - a.current);

      const summaryIdx = rows.findIndex(r => r[0] === '各产品收款汇总');
      const productRows = [];
      if (summaryIdx >= 0) {
        for (let i = summaryIdx + 2; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || r[0] === '数据汇总') break;
          productRows.push({ name: r[0], total: numOf(r[1]), target: numOf(r[2]) });
        }
      }
      productRows.sort((a,b) => b.total - a.total);

      const dailyStartIdx = rows.findIndex(r => /^\d{4}-\d{1,2}-\d{1,2}$/.test(r[0] || ''));
      const dailyRows = [];
      if (dailyStartIdx >= 0) {
        for (let i = dailyStartIdx; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(r[0])) break;
          dailyRows.push({ date: r[0], amount: numOf(r[1]) });
        }
      }

      // --- 扫描所有产品区块的明细行，收集完整交易记录 ---
      // 区块结构（每块10列）：付款日期,合作群组,产品类型,合作方式,收款金额,收款商务,到期日期,新增/续费,客户名称,(空)
      const blockStart = 8;
      const blockWidth = 10;
      const numBlocks = 18;
      const productNames = [];
      const headerRow = rows[0] || [];
      for (let b = 0; b < numBlocks; b++) {
        productNames.push(headerRow[blockStart + b * blockWidth] || `产品${b+1}`);
      }
      const detailEndIdx = rows.findIndex(r => r[0] === '各产品收款汇总');
      const detailRowsEnd = detailEndIdx >= 0 ? detailEndIdx : rows.length;

      const deals = [];
      for (let r = 2; r < detailRowsEnd; r++) {
        const row = rows[r];
        if (!row) continue;
        for (let b = 0; b < numBlocks; b++) {
          const base = blockStart + b * blockWidth;
          const amount = numOf(row[base + 4]);
          if (!amount) continue;
          deals.push({
            payDate: row[base] || '',
            group: row[base + 1] || '',
            productType: row[base + 2] || '',
            method: (row[base + 3] || '').trim().toUpperCase(),
            amount,
            biz: row[base + 5] || '',
            expiry: row[base + 6] || '',
            newRenew: row[base + 7] || '',
            client: row[base + 8] || '',
            product: productNames[b],
          });
        }
      }

      // 合作方式占比
      const methodTotals = {};
      deals.forEach(d => { if (d.method) methodTotals[d.method] = (methodTotals[d.method] || 0) + d.amount; });
      const methodEntries = Object.entries(methodTotals).sort((a,b) => b[1] - a[1]);
      const methodGrandTotal = methodEntries.reduce((s, [,v]) => s + v, 0);

      // 新增 vs 续费占比
      const newRenewTotals = {};
      deals.forEach(d => {
        const key = d.newRenew.trim() || '未标注';
        newRenewTotals[key] = (newRenewTotals[key] || 0) + d.amount;
      });
      const newRenewEntries = Object.entries(newRenewTotals).sort((a,b) => b[1] - a[1]);
      const newRenewGrandTotal = newRenewEntries.reduce((s, [,v]) => s + v, 0);

      // 合作群组/客户 Top榜
      const groupTotals = {};
      deals.forEach(d => {
        const key = d.group.trim() || d.client.trim() || '未命名';
        groupTotals[key] = (groupTotals[key] || 0) + d.amount;
      });
      const groupEntries = Object.entries(groupTotals).sort((a,b) => b[1] - a[1]).slice(0, 8);

      // 即将到期（未来7天内，仅解析标准日期格式，"自然消耗"等文字跳过）
      const today = new Date(); today.setHours(0,0,0,0);
      const in7days = new Date(today); in7days.setDate(in7days.getDate() + 7);
      const expiringDeals = deals
        .map(d => ({ ...d, expiryDate: parseFlexDate(d.expiry) }))
        .filter(d => d.expiryDate && d.expiryDate >= today && d.expiryDate <= in7days)
        .sort((a,b) => a.expiryDate - b.expiryDate);

      // 总单数与客单均价
      const dealCount = deals.length;
      const avgDeal = dealCount ? (deals.reduce((s,d) => s + d.amount, 0) / dealCount) : 0;

      // --- Hero ---
      document.getElementById('heroValue').textContent = fmt(totalCurrent);
      document.getElementById('heroTarget').textContent = fmt(totalTarget);
      document.getElementById('heroBarFill').style.width = totalPct + '%';
      document.getElementById('heroPct').textContent = totalPct.toFixed(2) + '% 已完成';

      const topBiz = bizRows[0];
      const topProduct = productRows[0];
      document.getElementById('topBizName').textContent = topBiz ? `${topBiz.name} · ${fmt(topBiz.current)}` : '暂无数据';
      document.getElementById('topProductName').textContent = topProduct ? `${topProduct.name.split('/')[0]} · ${fmt(topProduct.total)}` : '暂无数据';
      document.getElementById('dealStats').textContent = dealCount ? `${dealCount}单 / ${fmt(avgDeal)}` : '暂无数据';

      const grid = document.getElementById('mainGrid');
      grid.innerHTML = '';

      // 卡片1: 商务业绩排名
      let bizHtml = `<div class="card"><h2>商务业绩排名 <span class="tag">TEAM PERFORMANCE</span></h2>`;
      const maxBiz = Math.max(...bizRows.map(b => b.current), 1);
      bizRows.forEach((b, idx) => {
        const pct = pctOf(b.target, b.current);
        const widthPct = (b.current / maxBiz) * 100;
        const color = PALETTE[idx % PALETTE.length];
        bizHtml += `
          <div class="hbar-item">
            <div class="hbar-top">
              <span class="hbar-name">${rankBadge(idx)} <span class="txt">${b.name}</span></span>
              <span class="hbar-value">${fmt(b.current)}</span>
            </div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            <div class="hbar-sub">目标 ${fmt(b.target)} · 完成 ${pct.toFixed(1)}%</div>
          </div>`;
      });
      bizHtml += '</div>';
      grid.innerHTML += bizHtml;

      // 卡片2: 分类型目标完成度
      let typeProgressHtml = '';
      const maxType = Math.max(...typeRows.map(t => t.current), 1);
      typeRows.forEach((t, idx) => {
        const pct = pctOf(t.target, t.current);
        const widthPct = t.current > 0 ? (t.current / maxType) * 100 : 0;
        const color = PALETTE[idx % PALETTE.length];
        typeProgressHtml += `
          <div class="hbar-item">
            <div class="hbar-top">
              <span class="hbar-name"><span class="legend-dot" style="background:${color}"></span><span class="txt">${t.name}</span></span>
              <span class="hbar-value">${fmt(t.current)}</span>
            </div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            <div class="hbar-sub">目标 ${fmt(t.target)} · 完成 ${t.target ? pct.toFixed(1)+'%' : '-'}</div>
          </div>`;
      });
      grid.innerHTML += `
        <div class="card">
          <h2>分类型目标完成度 <span class="tag">BY CATEGORY</span></h2>
          <div class="chart-canvas-holder short"><canvas id="typeChart"></canvas></div>
          <div class="doughnut-legend" id="typeLegend"></div>
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);">
            <div style="font-size:11.5px;color:var(--text-3);letter-spacing:0.3px;margin-bottom:12px;">各类型收款进度</div>
            ${typeProgressHtml}
          </div>
        </div>`;

      // 卡片3: 伊甸维度产品业绩进度
      let prodHtml = `<div class="card"><h2>伊甸维度产品业绩进度 <span class="tag">PRODUCT TARGET</span></h2>`;
      const topN = productRows.slice(0, 10);
      topN.forEach((p, idx) => {
        const pct = pctOf(p.target, p.total);
        const widthPct = p.target ? pct : 0;
        const color = PALETTE[idx % PALETTE.length];
        prodHtml += `
          <div class="hbar-item">
            <div class="hbar-top">
              <span class="hbar-name">${rankBadge(idx)} <span class="txt">${p.name}</span></span>
              <span class="hbar-value">${fmt(p.total)}</span>
            </div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            <div class="hbar-sub">目标 ${p.target ? fmt(p.target) : '未设定'} · 完成 ${p.target ? pct.toFixed(1)+'%' : '-'}</div>
          </div>`;
      });
      prodHtml += '</div>';
      grid.innerHTML += prodHtml;

      // 卡片4: 合作方式占比 + 新增/续费占比（左右分栏）
      let methodHtml = `<div class="card"><h2>合作方式占比 · 新增续费构成 <span class="tag">DEAL TYPE / RENEWAL</span></h2>`;
      if (deals.length) {
        methodHtml += `<div style="display:flex;gap:20px;flex-wrap:wrap;">`;
        methodHtml += `<div style="flex:1;min-width:200px;">
            <div style="font-size:11px;color:var(--text-3);margin-bottom:10px;text-align:center;">合作方式</div>
            <div class="chart-canvas-holder short"><canvas id="methodChart"></canvas></div>
            <div class="doughnut-legend" id="methodLegend"></div>
          </div>`;
        methodHtml += `<div style="flex:1;min-width:200px;">
            <div style="font-size:11px;color:var(--text-3);margin-bottom:10px;text-align:center;">新增 / 续费</div>
            <div class="chart-canvas-holder short"><canvas id="newRenewChart"></canvas></div>
            <div class="doughnut-legend" id="newRenewLegend"></div>
          </div>`;
        methodHtml += `</div>`;
      } else {
        methodHtml += `<div class="empty-hint">暂无合作方式/新续费数据</div>`;
      }
      methodHtml += '</div>';
      grid.innerHTML += methodHtml;

      // 卡片5: 合作群组/客户 Top榜
      let groupHtml = `<div class="card"><h2>合作群组 / 客户 Top榜 <span class="tag">TOP PARTNERS</span></h2>`;
      if (groupEntries.length) {
        const maxGroup = Math.max(...groupEntries.map(([,v]) => v), 1);
        groupEntries.forEach(([name, amount], idx) => {
          const widthPct = (amount / maxGroup) * 100;
          const color = PALETTE[idx % PALETTE.length];
          groupHtml += `
            <div class="hbar-item">
              <div class="hbar-top">
                <span class="hbar-name">${rankBadge(idx)} <span class="txt">${name}</span></span>
                <span class="hbar-value">${fmt(amount)}</span>
              </div>
              <div class="hbar-track"><div class="hbar-fill" style="width:${widthPct}%;background:${color}"></div></div>
            </div>`;
        });
      } else {
        groupHtml += `<div class="empty-hint">暂无合作群组数据</div>`;
      }
      groupHtml += '</div>';
      grid.innerHTML += groupHtml;

      // 卡片6: 即将到期提醒（未来7天）
      let expiryHtml = `<div class="card"><h2>即将到期提醒 <span class="tag">EXPIRING IN 7 DAYS</span></h2>`;
      if (expiringDeals.length) {
        expiryHtml += `<table class="mini-table"><tr><th>产品</th><th>客户/群组</th><th>金额</th><th>到期</th><th>状态</th></tr>`;
        expiringDeals.forEach(d => {
          const daysLeft = Math.round((d.expiryDate - today) / 86400000);
          const pillClass = daysLeft <= 2 ? 'danger' : daysLeft <= 4 ? 'warn' : 'ok';
          const pillText = daysLeft === 0 ? '今天到期' : `${daysLeft}天后`;
          expiryHtml += `<tr>
            <td>${d.product.split('/')[0]}</td>
            <td>${(d.client || d.group).slice(0, 14)}</td>
            <td>${fmt(d.amount)}</td>
            <td>${d.expiry}</td>
            <td><span class="pill ${pillClass}">${pillText}</span></td>
          </tr>`;
        });
        expiryHtml += `</table>`;
      } else {
        expiryHtml += `<div class="empty-hint">未来7天内暂无到期合作 ✅</div>`;
      }
      expiryHtml += '</div>';
      grid.innerHTML += expiryHtml;

      // 卡片7: 每日流水趋势（折线图，span2）
      grid.innerHTML += `
        <div class="card span2">
          <h2>每日流水趋势 <span class="tag">SEPTEMBER DAILY</span></h2>
          <div class="chart-canvas-holder tall"><canvas id="dailyChart"></canvas></div>
        </div>`;

      // --- render charts after DOM injected ---
      renderTypeChart(typeRows);
      renderMethodChart(methodEntries, methodGrandTotal);
      renderNewRenewChart(newRenewEntries, newRenewGrandTotal);
      renderDailyChart(dailyRows);
    }

    function renderTypeChart(typeRows) {
      const ctx = document.getElementById('typeChart');
      if (!ctx) return;
      const labels = typeRows.map(t => t.name);
      const data = typeRows.map(t => t.current);
      const hasData = data.some(v => v > 0);
      const displayData = hasData ? data : typeRows.map(t => t.target || 1);
      const colors = labels.map((_, i) => PALETTE[i % PALETTE.length]);

      if (typeChartInstance) typeChartInstance.destroy();
      typeChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: displayData, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => c.label + ': ¥' + c.parsed.toLocaleString() }
            }
          }
        }
      });
      const legend = document.getElementById('typeLegend');
      legend.innerHTML = labels.map((l, i) =>
        `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l}</div>`
      ).join('');
    }

    function renderMethodChart(methodEntries, grandTotal) {
      const ctx = document.getElementById('methodChart');
      const legend = document.getElementById('methodLegend');
      if (!ctx) return;
      if (!methodEntries.length) { if (legend) legend.innerHTML = '<div class="empty-hint" style="padding:10px 0;">暂无数据</div>'; return; }
      const labels = methodEntries.map(([m]) => m);
      const data = methodEntries.map(([,v]) => v);
      const colors = labels.map((_, i) => PALETTE[i % PALETTE.length]);

      if (methodChartInstance) methodChartInstance.destroy();
      methodChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '62%',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => c.label + ': ¥' + c.parsed.toLocaleString() + ' (' + (grandTotal ? (c.parsed/grandTotal*100).toFixed(1) : 0) + '%)' }
            }
          }
        }
      });
      legend.innerHTML = labels.map((l, i) => {
        const pct = grandTotal ? (data[i]/grandTotal*100).toFixed(1) : '0';
        return `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l} ${pct}%</div>`;
      }).join('');
    }

    function renderNewRenewChart(entries, grandTotal) {
      const ctx = document.getElementById('newRenewChart');
      const legend = document.getElementById('newRenewLegend');
      if (!ctx) return;
      if (!entries.length) { if (legend) legend.innerHTML = '<div class="empty-hint" style="padding:10px 0;">暂无数据</div>'; return; }
      const labels = entries.map(([m]) => m);
      const data = entries.map(([,v]) => v);
      const nrColors = { '新增': '#34d399', '续费': '#60a5fa' };
      const colors = labels.map((l, i) => nrColors[l] || PALETTE[i % PALETTE.length]);

      if (newRenewChartInstance) newRenewChartInstance.destroy();
      newRenewChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '62%',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => c.label + ': ¥' + c.parsed.toLocaleString() + ' (' + (grandTotal ? (c.parsed/grandTotal*100).toFixed(1) : 0) + '%)' }
            }
          }
        }
      });
      legend.innerHTML = labels.map((l, i) => {
        const pct = grandTotal ? (data[i]/grandTotal*100).toFixed(1) : '0';
        return `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l} ${pct}%</div>`;
      }).join('');
    }

    function renderDailyChart(dailyRows) {
      const ctx = document.getElementById('dailyChart');
      if (!ctx || !dailyRows.length) return;
      const c2d = ctx.getContext('2d');
      const gradient = c2d.createLinearGradient(0, 0, 0, 280);
      gradient.addColorStop(0, 'rgba(139,92,246,0.45)');
      gradient.addColorStop(1, 'rgba(34,211,238,0.02)');

      const labels = dailyRows.map(d => d.date.split('-').slice(1).join('/'));
      const data = dailyRows.map(d => d.amount);

      if (dailyChartInstance) dailyChartInstance.destroy();
      dailyChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data, fill: true, backgroundColor: gradient, borderColor: '#8b5cf6',
            borderWidth: 2.5, tension: 0.35, pointRadius: 0, pointHoverRadius: 5,
            pointHoverBackgroundColor: '#22d3ee', pointHoverBorderColor: '#fff',
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#12141c', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#fff', bodyColor: '#d7dae4', padding: 10,
              callbacks: { label: (c) => '¥' + c.parsed.y.toLocaleString() }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#8b93ab', font: { size: 10 }, maxRotation: 0 } },
            y: {
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#8b93ab', font: { size: 10 }, callback: (v) => v >= 1000 ? (v/1000) + 'k' : v }
            }
          }
        }
      });
    }

    loadData();
    setInterval(loadData, REFRESH_MS);
  </script>
</body>
</html>
