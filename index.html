<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伊甸各产品收款 BI 看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-0: #05060a;
    --bg-1: #0a0d16;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --accent-1: #7c3aed;
    --accent-2: #06b6d4;
    --accent-3: #f43f5e;
    --gold: #fbbf24;
    --silver: #cbd5e1;
    --bronze: #fb923c;
    --text-1: #f5f6fa;
    --text-2: #9aa3b8;
  }
  html, body {
    background: radial-gradient(circle at 15% 0%, #1a1040 0%, transparent 45%),
                radial-gradient(circle at 85% 10%, #062935 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, #200a2e 0%, transparent 50%),
                var(--bg-0);
    background-attachment: fixed;
    color: var(--text-1);
    font-family: "SF Pro Display", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 32px 24px 60px; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--card-border);
  }
  .header .title-block h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #ffffff, #b3b9ff 60%, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .title-block .sub {
    color: var(--text-2);
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 0.3px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(6,182,212,0.12);
    border: 1px solid rgba(6,182,212,0.35);
    color: #67e8f9;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .status-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 8px 2px rgba(34,211,238,0.8);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 22px;
  }
  .kpi-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 20px 22px;
    overflow: hidden;
    backdrop-filter: blur(14px);
  }
  .kpi-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(124,58,237,0.14), transparent 60%);
    pointer-events: none;
  }
  .kpi-label { font-size: 12px; color: var(--text-2); letter-spacing: 0.4px; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
  .kpi-value.accent-a { color: #a78bfa; }
  .kpi-value.accent-b { color: #34d399; }
  .kpi-value.accent-c { color: #22d3ee; }
  .kpi-foot { font-size: 12px; color: var(--text-2); margin-top: 6px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 22px 24px;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  }
  .card h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }
  .card h2::before {
    content: '';
    width: 4px; height: 14px;
    background: linear-gradient(180deg, var(--accent-1), var(--accent-2));
    border-radius: 3px;
    display: inline-block;
  }

  .progress-total {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .ring-wrap { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 10; }
  .ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  .progress-detail .num { font-size: 24px; font-weight: 700; color: #fff; }
  .progress-detail .lbl { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .row .name { color: #d7dae4; display: flex; align-items: center; gap: 8px; }
  .row .bar-mini { width: 60px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .row .bar-mini-fill { height: 100%; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }
  .row .value { color: #fff; font-weight: 600; }
  .row .pct { color: #67e8f9; font-size: 11px; margin-left: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; color: var(--text-2); font-weight: 500;
    padding: 8px 6px; border-bottom: 1px solid var(--card-border);
    font-size: 11px; letter-spacing: 0.4px; text-transform: uppercase;
  }
  td { padding: 9px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #d7dae4; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .medal { font-weight: 700; }
  .medal.g { color: var(--gold); }
  .medal.s { color: var(--silver); }
  .medal.b { color: var(--bronze); }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.06);
    color: var(--text-2);
  }
  .badge.g { background: rgba(251,191,36,0.18); color: var(--gold); }
  .badge.s { background: rgba(203,213,225,0.14); color: var(--silver); }
  .badge.b { background: rgba(251,146,60,0.16); color: var(--bronze); }

  .chart-wrap { grid-column: 1 / -1; }
  .chart-canvas-holder { position: relative; height: 260px; }

  .loading { color: var(--text-2); text-align: center; padding: 60px; font-size: 14px; }
  .error {
    color: #fca5a5; background: rgba(244,63,94,0.08);
    border: 1px solid rgba(244,63,94,0.3);
    padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 13px;
  }
  .footer-note {
    text-align: center; color: var(--text-2); font-size: 12px; margin-top: 30px; opacity: 0.6;
  }
  @media (max-width: 640px) {
    .header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <h1>伊甸各产品收款 BI 看板</h1>
        <div class="sub">数据源 · Google Sheets 实时同步 &nbsp;·&nbsp; 9月收款明细登记表</div>
      </div>
      <div class="status-pill"><span class="dot"></span><span id="lastUpdated">同步中...</span></div>
    </div>

    <div id="errorBox"></div>
    <div class="kpi-row" id="kpiRow"></div>
    <div class="grid" id="mainGrid">
      <div class="loading">数据加载中，请稍候...</div>
    </div>

    <div class="footer-note">🧧 幸运儿自动看板 · 每 60 秒刷新一次</div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
    </defs>
  </svg>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSP-ZFLFt8CIKNI1V6NTCSdD055J8dZUxUhGYRzs3sEd-qyCjQf-DK12aQ92OUhGRfqYvrARr9IwB5p/pub?output=csv";
    const REFRESH_MS = 60 * 1000;
    let dailyChartInstance = null;

    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
          else field += c;
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\r') { /* skip */ }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else field += c;
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    function numOf(s) {
      if (!s) return 0;
      const n = parseFloat(String(s).replace(/,/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function pctOf(target, current) {
      if (!target) return 0;
      return Math.min(100, (current / target) * 100);
    }
    function fmt(n) { return '¥' + n.toLocaleString(); }

    async function loadData() {
      try {
        const res = await fetch(CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        render(rows);
        document.getElementById('errorBox').innerHTML = '';
        document.getElementById('lastUpdated').textContent =
          '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      } catch (e) {
        document.getElementById('errorBox').innerHTML =
          '<div class="error">⚠️ 数据加载失败：' + e.message + '（60秒后自动重试）</div>';
      }
    }

    function ring(pct, size = 108, stroke = 10) {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const offset = c - (pct / 100) * c;
      return `
        <div class="ring-wrap">
          <svg width="${size}" height="${size}">
            <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
            <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}"
              stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ring-center">${pct.toFixed(1)}%</div>
        </div>`;
    }

    function render(rows) {
      const summaryRow = rows.find(r => r[0] === '数据汇总' && numOf(r[4]) > 0);
      const totalTarget = summaryRow ? numOf(summaryRow[4]) : 0;
      const totalCurrent = summaryRow ? numOf(summaryRow[5]) : 0;
      const totalPct = pctOf(totalTarget, totalCurrent);

      const typeNames = ['约炮','博彩','直播','黄游','播放器','外围','AI服务','VPN'];
      const typeRows = rows.filter(r => typeNames.includes(r[0]));

      const bizNames = ['黄凯悦','周伟','吴倩','郭怀玉','全斗焕','程晨'];
      const bizRows = rows.filter(r => bizNames.includes(r[0]))
        .map(r => ({ name: r[0], target: numOf(r[4]), current: numOf(r[5]) }))
        .sort((a,b) => b.current - a.current);

      const summaryIdx = rows.findIndex(r => r[0] === '各产品收款汇总');
      const productRows = [];
      if (summaryIdx >= 0) {
        for (let i = summaryIdx + 2; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || r[0] === '数据汇总') break;
          productRows.push({ name: r[0], total: numOf(r[1]) });
        }
      }
      productRows.sort((a,b) => b.total - a.total);

      const dailyStartIdx = rows.findIndex(r => /^\d{4}-\d{1,2}-\d{1,2}$/.test(r[0] || ''));
      const dailyRows = [];
      if (dailyStartIdx >= 0) {
        for (let i = dailyStartIdx; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(r[0])) break;
          dailyRows.push({ date: r[0], amount: numOf(r[1]) });
        }
      }

      // --- KPI row ---
      const topBiz = bizRows[0];
      const topProduct = productRows[0];
      const activeDays = dailyRows.filter(d => d.amount > 0).length;
      const kpiRow = document.getElementById('kpiRow');
      kpiRow.innerHTML = `
        <div class="kpi-card">
          <div class="kpi-label">本月累计业绩</div>
          <div class="kpi-value accent-a">${fmt(totalCurrent)}</div>
          <div class="kpi-foot">目标 ${fmt(totalTarget)}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">目标完成度</div>
          <div class="kpi-value accent-c">${totalPct.toFixed(2)}%</div>
          <div class="kpi-foot">距达标还差 ${fmt(Math.max(0, totalTarget - totalCurrent))}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">领先商务</div>
          <div class="kpi-value accent-b">${topBiz ? topBiz.name : '-'}</div>
          <div class="kpi-foot">${topBiz ? fmt(topBiz.current) : ''}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">爆款产品</div>
          <div class="kpi-value">${topProduct ? topProduct.name.split('/')[0] : '-'}</div>
          <div class="kpi-foot">${topProduct ? fmt(topProduct.total) : ''}</div>
        </div>`;

      const grid = document.getElementById('mainGrid');
      grid.innerHTML = '';

      // 卡片1: 总进度 (环形图)
      grid.innerHTML += `
        <div class="card">
          <h2>本月总进度</h2>
          <div class="progress-total">
            ${ring(totalPct)}
            <div class="progress-detail">
              <div class="num">${fmt(totalCurrent)}</div>
              <div class="lbl">目标 ${fmt(totalTarget)}</div>
            </div>
          </div>
        </div>`;

      // 卡片2: 分类型目标完成度
      let typeHtml = '<div class="card"><h2>分类型目标完成度</h2>';
      typeRows.forEach(r => {
        const target = numOf(r[4]);
        const current = numOf(r[5]);
        const pct = pctOf(target, current);
        typeHtml += `<div class="row">
          <span class="name">${r[0]}</span>
          <span style="display:flex;align-items:center;gap:10px;">
            <span class="bar-mini"><span class="bar-mini-fill" style="width:${pct}%"></span></span>
            <span class="value">${fmt(current)}</span>
            <span class="pct">${target ? pct.toFixed(1)+'%' : '-'}</span>
          </span>
        </div>`;
      });
      typeHtml += '</div>';
      grid.innerHTML += typeHtml;

      // 卡片3: 商务业绩排名
      let bizHtml = '<div class="card"><h2>商务业绩排名</h2><table><tr><th>#</th><th>商务</th><th>业绩</th><th>目标</th><th>进度</th></tr>';
      bizRows.forEach((b, idx) => {
        const pct = pctOf(b.target, b.current);
        const cls = idx === 0 ? 'g' : idx === 1 ? 's' : idx === 2 ? 'b' : '';
        const badge = idx < 3 ? `<span class="badge ${cls}">${idx+1}</span>` : `<span class="badge">${idx+1}</span>`;
        bizHtml += `<tr><td>${badge}</td><td>${b.name}</td><td>${fmt(b.current)}</td><td>${fmt(b.target)}</td><td>${pct.toFixed(1)}%</td></tr>`;
      });
      bizHtml += '</table></div>';
      grid.innerHTML += bizHtml;

      // 卡片4: 产品收款排行
      let prodHtml = '<div class="card"><h2>产品收款排行</h2><table><tr><th>#</th><th>产品</th><th>收款总额</th></tr>';
      productRows.slice(0, 10).forEach((p, idx) => {
        const cls = idx === 0 ? 'g' : idx === 1 ? 's' : idx === 2 ? 'b' : '';
        const badge = idx < 3 ? `<span class="badge ${cls}">${idx+1}</span>` : `<span class="badge">${idx+1}</span>`;
        prodHtml += `<tr><td>${badge}</td><td>${p.name}</td><td>${fmt(p.total)}</td></tr>`;
      });
      prodHtml += '</table></div>';
      grid.innerHTML += prodHtml;

      // 卡片5: 每日流水趋势 (Chart.js)
      grid.innerHTML += `
        <div class="card chart-wrap">
          <h2>每日流水趋势（9月）</h2>
          <div class="chart-canvas-holder"><canvas id="dailyChart"></canvas></div>
        </div>`;

      if (dailyRows.length) {
        const ctx = document.getElementById('dailyChart').getContext('2d');
        const labels = dailyRows.map(d => d.date.split('-').slice(1).join('/'));
        const data = dailyRows.map(d => d.amount);
        const gradient = ctx.createLinearGradient(0, 0, 0, 260);
        gradient.addColorStop(0, 'rgba(124,58,237,0.55)');
        gradient.addColorStop(1, 'rgba(6,182,212,0.05)');

        if (dailyChartInstance) dailyChartInstance.destroy();
        dailyChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              data,
              backgroundColor: gradient,
              borderRadius: 6,
              borderSkipped: false,
              maxBarThickness: 22,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#12141c',
                borderColor: 'rgba(255,255,255,0.1)',
                borderWidth: 1,
                titleColor: '#fff',
                bodyColor: '#d7dae4',
                padding: 10,
                callbacks: { label: (c) => '¥' + c.parsed.y.toLocaleString() }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: '#9aa3b8', font: { size: 10 } }
              },
              y: {
                grid: { color: 'rgba(255,255,255,0.05)' },
                ticks: {
                  color: '#9aa3b8', font: { size: 10 },
                  callback: (v) => v >= 1000 ? (v/1000) + 'k' : v
                }
              }
            }
          }
        });
      }
    }

    loadData();
    setInterval(loadData, REFRESH_MS);
  </script>
</body>
</html>
